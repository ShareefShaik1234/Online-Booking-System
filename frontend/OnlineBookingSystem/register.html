<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reservix | Create Account</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="register-page">

        <!-- LEFT SIDE -->

        <div class="register-welcome">

            <div class="register-welcome-content">

                <div class="register-logo">
                    Reservix
                </div>

                <h1>
                    Start Your Journey
                </h1>

                <p>
                    Create your Reservix account and enjoy
                    a simple and convenient way to manage
                    all your bookings.
                </p>

                <div class="register-services">

                    <span>🎬 Movies</span>

                    <span>🚌 Bus</span>

                    <span>🚆 Train</span>

                    <span>🏨 Hotels</span>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="register-side">

            <div class="register-box">

                <div class="register-icon">
                    ✨
                </div>

                <h2>
                    Create Account
                </h2>

                <p class="register-subtitle">
                    Join Reservix today
                </p>


                <form id="registerForm">


                    <!-- USERNAME -->

                    <div class="register-input-group">

                        <label for="name">
                            Username
                        </label>

                        <div class="register-input-wrapper">

                            <span>
                                👤
                            </span>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your username"
                                autocomplete="username"
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="register-input-group">

                        <label for="pass">
                            Password
                        </label>

                        <div class="register-input-wrapper">

                            <span>
                                🔒
                            </span>

                            <input
                                type="password"
                                id="pass"
                                placeholder="Create a password"
                                autocomplete="new-password"
                            >

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="register-input-group">

                        <label for="confirm">
                            Confirm Password
                        </label>

                        <div class="register-input-wrapper">

                            <span>
                                🔐
                            </span>

                            <input
                                type="password"
                                id="confirm"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="register-submit">

                        Create Account

                    </button>

                </form>


                <div class="register-divider">

                    <span>OR</span>

                </div>


                <p class="already-account">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <a
                    href="index.html"
                    class="register-home">

                    ← Back to Reservix

                </a>

            </div>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
