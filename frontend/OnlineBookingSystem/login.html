<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservix | Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-page">

        <!-- Left Side -->
        <div class="login-welcome">

            <div class="welcome-content">

                <div class="reservix-logo">
                    Reservix
                </div>

                <h1>
                    Welcome Back!
                </h1>

                <p>
                    Login to your Reservix account and manage all
                    your bookings in one place.
                </p>

                <div class="welcome-services">

                    <span>🎬 Movies</span>
                    <span>🚌 Bus</span>
                    <span>🚆 Train</span>
                    <span>🏨 Hotels</span>

                </div>

            </div>

        </div>


        <!-- Right Side -->
        <div class="login-side">

            <div class="form-box">

                <div class="login-icon">
                    🔐
                </div>

                <h2>
                    User Login
                </h2>

                <p class="login-subtitle">
                    Enter your credentials to continue
                </p>


                <form id="loginForm">

                    <div class="login-input-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                👤
                            </span>

                            <input
                                type="text"
                                id="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                            >

                        </div>

                    </div>


                    <div class="login-input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="login-submit"
                    >

                        Login

                    </button>

                </form>


                <div class="login-divider">

                    <span>OR</span>

                </div>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>


                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Back to Reservix
                </a>

            </div>

        </div>

    </div>


    <script src="JS/login.js"></script>

</body>

</html>
